name: Build
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: true

      - name: Format, lint and type check
        run: vp check
